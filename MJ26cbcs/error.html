<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VTU Result</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#636363;
      min-height:100vh;
      width:100%;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:38vh;
    }

    .popup{
      background:#f2f2f2;
      border-radius:16px;
      width:88%;
      max-width:340px;
      padding:20px 20px 0 20px;
      box-shadow:0 8px 32px rgba(0,0,0,0.38);
    }

    .popup-title{
      font-size:18px;
      font-weight:600;
      color:#000;
      margin-bottom:10px;
      line-height:1.3;
    }

    .popup-msg{
      font-size:14px;
      color:#3c3c3c;
      margin-bottom:20px;
      line-height:1.5;
    }

    .popup-footer{
      display:flex;
      justify-content:flex-end;
      padding:10px 0 14px;
    }

    .popup-ok{
      color:#2c5fc3;
      font-size:16px;
      font-weight:600;
      text-decoration:none;
      background:none;
      border:none;
      cursor:pointer;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      padding:2px 4px;
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="popup-title">results.vtu.it.com says</div>
    <div class="popup-msg">University Seat Number is not available or Invalid..!</div>
    <div class="popup-footer">
      <a class="popup-ok" href="index.html">OK</a>
    </div>
  </div>
</body>
</html>
